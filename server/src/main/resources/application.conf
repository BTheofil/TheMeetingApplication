ktor {
    application {
        modules = [ hu.tb.meet.ApplicationKt.module ]
    }
    deployment {
        port = 8081
    }
}

jwt {
    realm = "meeting-server"
    issuer = "hu.tb.meet"
    audience = "meeting-users"
    expiresInDays = 5
    secret {
        meeting = ${?JWT_SECRET_MEETING}
    }
}
