[versions]
agp = "9.4.0"
androidTools = "32.4.0"
activityCompose = "1.13.0"
koin = "4.2.2"
kotlin = "2.4.20"
composeBom = "2026.09.00"
composeAnalyzer = "0.13.0"
composeRuntime = "1.12.1"
nav3Core = "1.1.7"
lifecycleViewmodelNav3 = "2.11.0"
ktor = "3.5.2"
kotlinxSerialization = "1.11.0"
kotlinxDatetime = "0.8.0"
datastoreVersion = "1.2.1"
coreSplashscreen = "1.2.0"
androidxCore = "1.19.0"
firebase = "34.19.0"
googleServices = "4.5.0"

#Project settings
minSdk = "26"
compileSdk = "37"
targetSdk = "37"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "composeRuntime" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }
koin = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastoreVersion" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

#Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase" }
firebase-message = { module = "com.google.firebase:firebase-messaging" }
firebase-installations = { module = "com.google.firebase:firebase-installations" }

# Network
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Dependencies of the included build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle-api", version.ref = "agp" }
android-tools-common = { group = "com.android.tools", name = "common", version.ref = "androidTools" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
stability-analyzer = { id = "com.github.skydoves.compose.stability.analyzer", version.ref = "composeAnalyzer" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }

meet-android-application = { id = "meet.android.application" }
meet-android-application-compose = { id = "meet.android.application.compose" }
meet-android-library = { id = "meet.android.library" }
meet-android-library-compose = { id = "meet.android.library.compose" }
meet-jvm-library = { id = "meet.jvm.library" }

[bundles]
koin = [
    "koin", "koin-compose"
]
nav3 = [
    "androidx-navigation3-ui", "androidx-navigation3-runtime", "androidx-lifecycle-viewmodel-navigation3"
]
ktor = [
    "ktor-client-core", "ktor-client-okhttp", "ktor-client-content-negotiation",
    "ktor-client-logging", "ktor-serialization-kotlinx-json", "ktor-client-auth"
]
